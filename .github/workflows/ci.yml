name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: flake8 . --jobs 1

      - name: Run tests
        env:
          TESTING: "1"
          USE_MOCK_DB: "1"
        run: pytest -q

      - name: Build Docker image
        run: docker build -t personal-finance-tracker:ci .

      - name: Smoke test container
        env:
          TESTING: "1"
          USE_MOCK_DB: "1"
        run: |
          docker run -d --rm -p 5000:5000 --name pft personal-finance-tracker:ci
          sleep 5
          curl -f http://localhost:5000/health
          docker stop pft
